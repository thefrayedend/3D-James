<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3DJames</title>
<link rel="icon" type="image/png" sizes="256x256" href="ICON_256">
<link rel="icon" type="image/png" sizes="32x32" href="ICON_32">
<style>
[hidden] { display: none !important; }
html, body { margin: 0; }
/* Layout follows 3D Builder: blue tab strip, light command row, endless floor, compact bar at the bottom, fold-away panel on the right. */
:root {
  --tabbar: #4a95d6; --tabbar-ink: #ffffff; --tabbar-hover: rgba(255,255,255,.14);
  --bg: #f2f2f2; --panel: #f7f8f9; --panel-2: #eceef0; --raised: #ffffff; --line: #d9dde1; --line-2: #c4cad0;
  --ink: #1b1f24; --ink-2: #5c6670; --ink-3: #8a939c;
  --accent: #2f8cf0; --accent-soft: #dcecfd; --accent-ink: #ffffff; --outline: #1e8fff;
  --pick: #f08a24; --danger: #c8423b; --danger-soft: #f8e1df;
  --vp-bg: #dadde1; --floor-a: #e9ebed; --floor-b: #dcdfe2; --ruler: #59626c; --edge: #1d2733;
  --ax-x: #7ed321; --ax-y: #35c8f4; --ax-z: #1ea0ff;
  --bar: #ececec; --bar-hover: #dfe1e3; --bar-on: #a7aeb5;
  --shadow: 0 4px 18px rgba(20, 28, 36, .16), 0 1px 3px rgba(20, 28, 36, .10);
  --ui: "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --tabbar: #1d3954; --bar: #2c3238; --bar-hover: #363d44; --bar-on: #4a535c; --tabbar-ink: #e8eef5; --tabbar-hover: rgba(255,255,255,.08);
    --bg: #23272c; --panel: #1c2024; --panel-2: #262b31; --raised: #2a3036; --line: #343b43; --line-2: #45505b;
    --ink: #e6eaee; --ink-2: #a0aab4; --ink-3: #6f7a85;
    --accent: #4d9ff5; --accent-soft: #1f3550; --accent-ink: #0b1420; --outline: #5cbcff;
    --pick: #f39a3d; --danger: #e5675f; --danger-soft: #3a2224;
    --vp-bg: #202428; --floor-a: #33383e; --floor-b: #2b3035; --ruler: #a3adb8; --edge: #07090b;
    --shadow: 0 6px 22px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --tabbar: #1d3954; --bar: #2c3238; --bar-hover: #363d44; --bar-on: #4a535c; --tabbar-ink: #e8eef5; --tabbar-hover: rgba(255,255,255,.08);
  --bg: #23272c; --panel: #1c2024; --panel-2: #262b31; --raised: #2a3036; --line: #343b43; --line-2: #45505b;
  --ink: #e6eaee; --ink-2: #a0aab4; --ink-3: #6f7a85;
  --accent: #4d9ff5; --accent-soft: #1f3550; --accent-ink: #0b1420; --outline: #5cbcff;
  --pick: #f39a3d; --danger: #e5675f; --danger-soft: #3a2224;
  --vp-bg: #202428; --floor-a: #33383e; --floor-b: #2b3035; --ruler: #a3adb8; --edge: #07090b;
  --shadow: 0 6px 22px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
img.uic { width: 16px; height: 16px; object-fit: contain; flex: none; }
:root[data-theme="dark"] img.uic { filter: invert(1) hue-rotate(180deg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) img.uic { filter: invert(1) hue-rotate(180deg); } }
.tb-icon img.uic { width: 18px; height: 18px; }
svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex: none; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: 1fr auto; grid-template-areas: "tabbar tabbar" "cmdbar cmdbar" "view side"; }

/* blue tab strip */
#tabbar { grid-area: tabbar; display: flex; align-items: stretch; background: var(--tabbar); color: var(--tabbar-ink); padding: 6px 8px 0 0; gap: 2px; min-width: 0; }
.tabs-row { display: flex; align-items: stretch; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tab { border: 0; background: none; color: var(--tabbar-ink); font: 300 21px/1 var(--ui); padding: 7px 15px 9px; cursor: pointer; white-space: nowrap; }
.tab:hover { background: var(--tabbar-hover); }
.tab.on { background: var(--bg); color: var(--ink); }
.tb-icon { border: 0; background: none; color: var(--tabbar-ink); width: 38px; display: grid; place-items: center; cursor: pointer; margin-bottom: 6px; border-radius: 4px; }
.tb-icon svg.lucide { width: 18px; height: 18px; }
.tb-icon:hover, .tb-text:hover { background: var(--tabbar-hover); }
.tb-icon[disabled] { opacity: .45; cursor: default; background: none; }
.tb-text { border: 0; background: none; color: var(--tabbar-ink); display: flex; align-items: center; gap: 7px; padding: 0 12px; cursor: pointer; margin-bottom: 6px; font-size: 15px; border-radius: 4px; }
.tb-sep { width: 1px; background: rgba(255,255,255,.35); margin: 8px 4px 14px; }
.doc-name { align-self: center; margin-bottom: 6px; width: 150px; border: 1px solid transparent; background: transparent; color: var(--tabbar-ink); border-radius: 4px; padding: 4px 8px; font-size: 13px; opacity: .9; }
.doc-name:hover, .doc-name:focus { border-color: rgba(255,255,255,.45); outline: none; opacity: 1; }

/* command row */
#cmdbar { grid-area: cmdbar; display: flex; align-items: center; gap: 2px; padding: 4px 6px; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; min-height: 42px; }
.cb { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 7px; border: 0; background: none; border-radius: 4px; cursor: pointer; font-size: 14px; white-space: nowrap; position: relative; flex: none; }
#cmdbar.compact .cb { padding: 0 4px; gap: 3px; font-size: 13px; }
#cmdbar.compact .csep { margin: 6px 3px; }
#cmdbar.icons .cb > span { display: none; }
#cmdbar.icons .cb { padding: 0 6px; }
.cb:hover { background: var(--panel-2); }
.cb.on { background: var(--accent-soft); color: var(--accent); }
.cb[disabled] { opacity: .38; cursor: default; background: none; }
.cb svg.lucide:last-child:not(:first-child) { width: 12px; height: 12px; }
.csep { width: 1px; align-self: stretch; background: var(--line-2); margin: 6px 4px; flex: none; }
.cmuted { color: var(--ink-2); padding: 0 8px; white-space: nowrap; }
.swgrid { display: grid; grid-template-columns: repeat(10, 18px); gap: 3px; margin: 0 6px; }
.swl { width: 18px; height: 16px; border: 1px solid #a0a0a0; cursor: pointer; padding: 0; border-radius: 0; }
.swl.on { outline: 2px solid var(--accent); outline-offset: 1px; }

/* viewport */
#view { grid-area: view; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--vp-bg); }
#view canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.float { position: absolute; z-index: 5; background: var(--raised); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }

/* bottom bar: modes + typed X/Y/Z, flat like 3D Builder */
#objbar { left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: stretch; gap: 0; padding: 0; border-radius: 2px; border: 1px solid var(--line); background: var(--bar); box-shadow: 0 2px 8px rgba(0,0,0,.10); max-width: calc(100% - 24px); height: 50px; }
.mb { width: 48px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: var(--ink); }
.mb:hover { background: var(--bar-hover); }
.mb.on { background: var(--bar-on); }
.mb svg { width: 22px; height: 22px; }
.bf { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 2px; position: relative; }
.bf .bl { font: 400 13px/1 var(--ui); color: var(--ink); margin-bottom: -1px; }
.bf input { width: 66px; height: 28px; border: 0; background: transparent; text-align: center; font: 300 21px/1 var(--ui); font-variant-numeric: tabular-nums; padding: 0 2px; color: var(--ink); }
.bf::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 4px; height: 3px; border-radius: 2px; background: #1ea0ff; opacity: .8; }
.bf.on::after { background: #7ed321; opacity: 1; }
.bf input:focus { outline: none; background: var(--raised); box-shadow: inset 0 0 0 1px var(--accent); }
.bunit { border: 0; background: none; cursor: pointer; font: 300 19px var(--ui); color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; padding: 8px 8px 0; }
.bunit.static { cursor: default; text-decoration: none; }
.bunit:hover:not(.static) { background: var(--bar-hover); }

/* on-screen handles */
.ruler { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.ruler-lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ruler-lines line { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
.ruler-lines circle { fill: var(--accent); }
.ruler-num, .ruler-in { position: absolute; left: 0; top: 0; pointer-events: auto; font: 600 12px var(--ui); color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 2px 7px; cursor: text; }
.ruler-in { width: 56px; text-align: center; color: var(--ink); background: var(--panel); border: 1.5px solid var(--accent); outline: none; }
.align-ov { z-index: 5; }
.al-dot { position: absolute; left: 0; top: 0; width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 2px solid var(--accent); background: var(--panel); pointer-events: auto; cursor: pointer; }
.al-dot.mid { width: 11px; height: 11px; }
.al-dot:hover { background: var(--accent); transform-origin: center; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
.al-anchor { position: absolute; left: 0; top: 0; font: 600 11px var(--ui); color: #fff; background: var(--accent); border-radius: 9px; padding: 2px 8px; white-space: nowrap; }
.sketch { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--panel); }
/* Sketch mode: the drawing board gets the whole window (the tabs, tool row and side panel come back on Done or Cancel) */
body.sketching #app { grid-template-rows: 1fr; grid-template-columns: 1fr; grid-template-areas: "view"; }
body.sketching #tabbar, body.sketching #cmdbar, body.sketching #side { display: none; }
.sk-bar { display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--bar); flex-wrap: wrap; }
.sk-bar .btn { margin-left: 4px; }
.sk-bar { gap: 1px; }
.sk-bar .cb { padding: 0 5px; gap: 4px; }
/* narrower windows: Delete and Import show just their icons, so the bar stays on one row */
@media (max-width: 1239px) { .sk-bar .cb.sk-short > span { display: none; } }
.sk-main { flex: 1; display: flex; min-height: 0; }
.sk-canvas { flex: 1; position: relative; min-width: 0; }
.sk-svg { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--bg, #f3f4f6); cursor: crosshair; touch-action: none; }
.sk-grid line { stroke: var(--line); stroke-width: .5; }
.sk-grid line.major { stroke: var(--ink-3); stroke-width: .6; opacity: .45; }
.sk-grid line.axis.x { stroke: #e05555; opacity: .7; } .sk-grid line.axis.y { stroke: #3fae4f; opacity: .7; }
.sk-fill { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: none; }
.sk-loop { fill: none; stroke: var(--accent); stroke-width: 2; }
.sk-loop.sel { stroke: #f08a24; stroke-width: 2.5; }
.sk-pt { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; }
.sk-pt.sel { stroke: #f08a24; }
.sk-draft { fill: none; stroke: #f08a24; stroke-width: 1.8; stroke-dasharray: 5 3; }
.sk-trim { fill: none; stroke: #e0342b; stroke-width: 5; stroke-linecap: round; opacity: .85; pointer-events: none; }
.sk-cursor { fill: #f08a24; }
.field .fslider { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 4px; }
.sk-len { font: 600 11.5px var(--ui); fill: var(--accent); cursor: pointer; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
.sk-len:hover { fill: #f08a24; text-decoration: underline; }
.sk-edge-sel { stroke: #f08a24; stroke-width: 4; stroke-linecap: round; }
.sk-ask { position: absolute; transform: translate(-50%, -50%); width: 70px; text-align: center; z-index: 2; }
.sk-dim { font: 600 12px var(--ui); fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
.sk-hint { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); pointer-events: none; }
.sk-typed { background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 10px; }
.sk-side { width: 250px; border-left: 1px solid var(--line); overflow: auto; padding: 8px 10px; }
.sk-item { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; cursor: pointer; }
.sk-item.sel { border-color: #f08a24; }
.sk-item-h { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.sk-row { display: grid; grid-template-columns: 60px 1fr 1fr; gap: 4px; align-items: center; font-size: 12px; margin: 2px 0; }
.sk-row .in { min-width: 0; }
.sk-row.two { grid-template-columns: 60px 1fr; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.sk-ref { fill: none; stroke: var(--ink-3); stroke-width: 1.4; stroke-dasharray: 4 3; opacity: .8; }
.sk-bend { fill: var(--panel); stroke: #f08a24; stroke-width: 1.5; cursor: grab; }
.sk-corner-sel { fill: none; stroke: #f08a24; stroke-width: 2; }
.sk-open-end { fill: none; stroke: #f08c00; stroke-width: 2.5; pointer-events: none; }
/* touch mode (tablets, Apple Pencil): bigger targets and on-screen keys; nothing changes for the mouse */
.touch-only { display: none !important; }
body.touch-ui .touch-only { display: inline-flex !important; }
body.touch-ui .cb { min-height: 46px; min-width: 46px; }
body.touch-ui .tab { padding-top: 10px; padding-bottom: 10px; }
body.touch-ui .chip { min-height: 36px; padding-left: 12px; padding-right: 12px; }
body.touch-ui .mi, body.touch-ui .menu button { min-height: 44px; }
body.touch-ui .in { min-height: 40px; font-size: 16px; }
.sk-svg { touch-action: none; }
.sk-keys { gap: 2px; align-items: center; margin-left: auto; } .sk-key.on, .touch-key.on { background: var(--accent); color: #fff; }
.touch-key { position: absolute; left: 12px; bottom: 44px; z-index: 5; padding: 10px 16px; border-radius: 22px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font: 600 14px var(--ui); }
.sk-pad { left: 50% !important; top: 12px !important; transform: translateX(-50%); width: 200px; font-size: 18px; }
/* Insert > Sketch > From a photo */
dialog.pw-dialog { width: min(1400px, 97vw); }
.pw { display: grid; grid-template-columns: 1fr 300px; gap: 14px; height: min(72vh, 760px); }
.pw-left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pw-holder { position: relative; flex: 1; min-height: 0; border-radius: 8px; overflow: hidden; background: #2b2f36; }
.pw-canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.pw-loupe { position: absolute; display: none; width: 160px; height: 160px; border-radius: 50%; border: 3px solid #ff7a00; box-shadow: 0 4px 16px #0006; pointer-events: none; }
.pw-status { min-height: 20px; padding-top: 6px; font-size: 13px; color: var(--ink-2); }
.pw-side { overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.pw-side h3 { margin: 6px 0 0; font-size: 14px; }
.pw-tip { font-size: 12px; } .pw-count { font-weight: 600; font-size: 13px; }
.pw-two { display: flex; gap: 6px; align-items: center; } .pw-two .in { flex: 1; min-width: 0; }
.pw-go { display: flex; flex-direction: column; gap: 6px; } .pw-label { font-weight: 600; font-size: 12px; margin-top: 4px; }
@media (max-width: 760px) { .pw { grid-template-columns: 1fr; height: auto; } .pw-holder { height: 55vh; flex: none; } }
/* the Open / Save window for a 3DJames server's folders */
dialog.fb-dialog { width: min(980px, 96vw); }
.fb { display: grid; grid-template-columns: 200px 1fr; gap: 12px; min-height: 380px; }
.fb-side { display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line-2); padding-right: 8px; }
.fb-place { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: 500 13px var(--ui); text-align: left; cursor: pointer; }
.fb-place:hover { background: var(--accent-soft); } .fb-place.on { background: var(--accent-soft); font-weight: 700; }
.fb-place svg { width: 16px; height: 16px; flex: none; }
.fb-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fb-crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.fb-list { flex: 1; min-height: 260px; max-height: 50vh; overflow: auto; border: 1px solid var(--line-2); border-radius: 8px; }
.fb-row { display: grid; grid-template-columns: 20px 1fr auto 150px; gap: 10px; align-items: center; padding: 7px 10px; cursor: pointer; font: 13px var(--ui); }
.fb-row svg { width: 16px; height: 16px; } .fb-row:hover { background: var(--accent-soft); } .fb-row.on { background: var(--accent); color: #fff; } .fb-row.on .muted { color: #fff; }
.fb-name { display: flex; gap: 8px; } .fb-status { min-height: 16px; font-size: 12px; }
@media (max-width: 640px) { .fb { grid-template-columns: 1fr; } .fb-side { flex-direction: row; flex-wrap: wrap; border-right: 0; } .fb-row { grid-template-columns: 20px 1fr auto; } .fb-row > :last-child { display: none; } }
.sk-reach { fill: rgba(240, 140, 0, .07); stroke: #f08c00; stroke-width: 1; stroke-dasharray: 3 4; pointer-events: none; }
.sk-snap.end { stroke: #f08c00; }
.sk-reach.free { fill: none; stroke: var(--ink-3); }
.sk-loop.open { stroke-dasharray: none; }
.sk-owner { display:grid;grid-template-columns:12px 1fr auto;gap:2px 6px;align-items:center;padding:6px;border-radius:8px;margin-bottom:4px;border:1px solid var(--line); }
.sk-owner.on { border-color: var(--accent); }
.sk-owner .chip-row { grid-column:1 / -1; }
.sk-owner-dot { width:12px;height:12px;border-radius:50%; }
.sk-open-to { fill: none; stroke: #2e9e5b; stroke-width: 2; stroke-dasharray: 4 3; }
.sk-rule { font: 700 12px var(--ui); fill: #7a4fd0; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; pointer-events: none; }
.sk-len.locked { fill: #7a4fd0; }
.sk-guide { stroke: #7a4fd0; stroke-width: 1; stroke-dasharray: 3 3; }
.sk-snap { fill: none; stroke: #7a4fd0; stroke-width: 1.6; }
.sk-snap.middle { transform-box: fill-box; transform-origin: center; transform: rotate(45deg); }
.sk-snap.center { rx: 6px; }
.sk-snap-t { font: 600 11px var(--ui); fill: #7a4fd0; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
.sk-rule-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11.5px; margin: 2px 0; }
.sk-rule-row .chip { padding: 1px 7px; }
.sk-helper { fill: none; stroke: #8a6fd6; stroke-width: 1.4; stroke-dasharray: 7 4; }
.helpview { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; flex-direction: column; background: var(--bg, #f3f4f6); }
.help-nav { width: 270px; flex: none; border-right: 1px solid var(--line); background: var(--panel); padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.help-search { margin-bottom: 8px; height: 34px; font-family: var(--ui); }
.help-link { display: flex; gap: 10px; align-items: center; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; font: 500 14px var(--ui); color: var(--ink); cursor: pointer; }
.help-link:hover { background: var(--accent-soft); }
.help-link.on { background: var(--accent); color: #fff; }
.help-num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--accent-soft); color: var(--ink); flex: none; }
.help-link.on .help-num { background: rgba(255,255,255,.25); color: #fff; }
.help-foot { margin-top: auto; padding-top: 12px; display: grid; gap: 6px; }
.help-article { flex: 1; overflow: auto; padding: 28px 40px 40px; }
.help-body { max-width: 900px; margin: 0 auto; font: 15.5px/1.6 var(--ui); color: var(--ink); }
.help-body h1 { font-size: 30px; margin: 0 0 12px; }
.help-body h2 { font-size: 20px; margin: 26px 0 8px; }
.help-body h3 { font-size: 16.5px; margin: 20px 0 6px; }
.help-body img { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; margin: 14px 0; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.help-body img.small { max-width: 520px; }
.help-body img[role="button"] { cursor: zoom-in; }
.help-body img[role="button"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.help-body figure { margin: 20px 0; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
